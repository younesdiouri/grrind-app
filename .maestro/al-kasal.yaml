appId: app.grrind.dev
tags:
  - ios
  - combat
---
# Démonstration locale : aucune connexion, création de compte ou mutation API.
- launchApp
- openLink: grrindapp-dev://combat-demo
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible: "Ouvrir dans.*"
          commands:
            - tapOn: "Ouvrir"
- extendedWaitUntil:
    visible: "Repos"
    timeout: 30000
# Le pilote Cailloux est désormais 3D ; ses gestes sont couverts par combat-3d.yaml.
- openLink: grrindapp-dev://combat-demo?mob=pebble
- extendedWaitUntil:
    visible: "Cailloux dans la Chaussure"
    timeout: 15000
- takeScreenshot: pebble-idle
- assertVisible: "Jouer une victoire"
- assertVisible: "Jouer une défaite"
- openLink: grrindapp-dev://combat-demo
- extendedWaitUntil:
    visible: "Al-Kasal"
    timeout: 15000
- takeScreenshot: al-kasal-idle
- tapOn: "Attaque"
- takeScreenshot: al-kasal-attack
- tapOn: "Coup reçu"
- takeScreenshot: al-kasal-hit
- tapOn: "Critique"
- takeScreenshot: al-kasal-critical
- tapOn: "Esquive"
- takeScreenshot: al-kasal-dodge
- tapOn: "Combo"
- takeScreenshot: al-kasal-combo
- tapOn: "Relance"
- takeScreenshot: al-kasal-replay
- tapOn: "Jouer une victoire"
- extendedWaitUntil:
    visible: ".*Toucher pour combattre.*"
    timeout: 10000
- setOrientation: LANDSCAPE_LEFT
- assertVisible: ".*je suis la paresse, laissez tomber, ce jeu n'est pas fait pour vous.*"
- takeScreenshot: al-kasal-dialogue
- tapOn:
    id: "battle-dialogue"
- assertNotVisible: ".*Toucher pour combattre.*"
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 90000
- assertVisible: ".*Victoire.*"
- takeScreenshot: al-kasal-victory
- tapOn:
    id: "battle-exit"
- setOrientation: PORTRAIT
- assertVisible: "Repos"
- tapOn: "Jouer une défaite"
- extendedWaitUntil:
    visible: ".*Toucher pour combattre.*"
    timeout: 10000
- setOrientation: LANDSCAPE_LEFT
- tapOn:
    id: "battle-dialogue"
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 90000
- assertVisible: ".*Défaite.*"
- takeScreenshot: al-kasal-defeat
- tapOn:
    id: "battle-exit"
- setOrientation: PORTRAIT
- assertVisible: "Repos"
- tapOn: "Jouer une victoire"
- extendedWaitUntil:
    visible: ".*Toucher pour combattre.*"
    timeout: 10000
- setOrientation: LANDSCAPE_LEFT
- tapOn:
    id: "battle-dialogue"
- tapOn:
    id: "battle-combat"
- assertVisible: ".*Victoire.*"
- tapOn:
    id: "battle-exit"
- setOrientation: PORTRAIT
- assertVisible: "Repos"
