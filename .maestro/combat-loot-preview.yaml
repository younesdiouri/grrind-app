appId: app.grrind.dev
---
# Local captured reward, explicit demo notice; no login, account creation or credit.
- launchApp
- openLink: grrindapp-dev://combat-demo?scenario=loot&mob=pebble
- extendedWaitUntil:
    visible:
      id: battle-dialogue
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- tapOn:
    id: battle-dialogue
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 90000
- takeScreenshot: unity-victory-gains
- tapOn:
    id: battle-details
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            notVisible: ".*Bourse.*"
          commands:
            - swipe:
                from:
                  id: battle-recap-scroll
                direction: UP
- assertVisible: ".*Bourse.*"
- takeScreenshot: unity-loot-details
- tapOn:
    id: battle-exit
- extendedWaitUntil:
    visible:
      id: al-kasal-idle
    timeout: 15000
- setOrientation: PORTRAIT
