appId: app.grrind.dev
---
- scrollUntilVisible:
    element:
      id: character-tab-equipment
    direction: UP
- scrollUntilVisible:
    element:
      id: equipment-slot-${SLOT}
    direction: DOWN
    centerElement: true
- tapOn:
    id: equipment-slot-${SLOT}
- scrollUntilVisible:
    element:
      text: "${ITEM},.*"
    direction: DOWN
    centerElement: true
- tapOn: "${ITEM},.*"
- scrollUntilVisible:
    element:
      text: "Retirer — ${ITEM}"
    direction: DOWN
- tapOn: "Retirer — ${ITEM}"
- extendedWaitUntil:
    visible: "Équiper — ${ITEM}"
    timeout: 15000
- tapOn: Fermer la fiche
- scrollUntilVisible:
    element:
      id: equipment-slot-${SLOT}
    direction: UP
    centerElement: true
- extendedWaitUntil:
    visible:
      id: equipment-slot-${SLOT}
      text: ".*, vide"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: combat-avatar-ready
    direction: UP
    centerElement: true
- assertNotVisible: "Personnage équipé :.*${ITEM}.*"

