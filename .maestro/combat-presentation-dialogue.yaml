appId: app.grrind.e2e
---
- openLink: grrindapp-e2e://combat-demo?network=${SCENARIO}
- runFlow:
    when:
      visible: "Ouvrir dans.*"
    commands:
      - tapOn: "Ouvrir"
- extendedWaitUntil:
    visible: ".*Toucher pour combattre.*"
    timeout: 20000
- setOrientation: LANDSCAPE_LEFT
- assertVisible: ".*Gardien du repos.*"
- assertVisible: ".*Cette réplique vient de la réponse du combat.*"
- takeScreenshot: presentation-${SCENARIO}
- tapOn:
    id: "battle-dialogue"
- assertNotVisible: ".*Toucher pour combattre.*"
- extendedWaitUntil:
    visible: ".*Touche pour revenir.*"
    timeout: 30000
- assertVisible: ".*Victoire.*"
- tapOn:
    id: "battle-exit"
- setOrientation: PORTRAIT
- assertVisible: "Repos"
