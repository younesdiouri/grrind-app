appId: app.grrind.dev
---
# The sole character workshop is now Quaternius. E2E_OFFLINE=1.
- runFlow: quaternius-poc.yaml
- openLink: grrindapp-dev://avatar-3d
- extendedWaitUntil:
    visible:
      id: quaternius-ready
    timeout: 20000
# Also exercise BattleView's defaults, without the workshop's explicit avatar overrides.
- openLink: grrindapp-dev://combat-demo?scenario=duel&at=3200
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: unity-renderer-ready
- takeScreenshot: quaternius-default-pvp
- openLink: grrindapp-dev://character-showcase
- extendedWaitUntil:
    visible:
      id: quaternius-ready
    timeout: 20000
- takeScreenshot: quaternius-workshop-after-default-pvp
- setOrientation: PORTRAIT
