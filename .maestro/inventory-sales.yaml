appId: app.grrind.dev
tags:
  - ios
  - inventory
---
# Compte dédié préchargé côté backend : t-shirt ardoise ×2 équipé, gants de boxe ×1 dans le sac, coffre ×1.
# MAESTRO_SALE_EMAIL choisit ce compte; préparation via les API normales, sans reset de base.
- launchApp
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - tapOn: "Close"
- runFlow:
    file: login.yaml
    env:
      EMAIL: ${MAESTRO_SALE_EMAIL}
- extendedWaitUntil:
    visible: "NIVEAU"
    timeout: 30000
- tapOn:
    id: "bag-row"
- extendedWaitUntil:
    visible: "BOURSE"
    timeout: 15000
- takeScreenshot: sale-inventory-before
- scrollUntilVisible:
    element:
      text: "Vendre — Gants de boxe dorés"
    direction: DOWN
- tapOn: "Vendre — Gants de boxe dorés"
- assertVisible: "Vendre un exemplaire ?"
- assertVisible: ".*Gants de boxe dorés.*10 pièces.*"
- takeScreenshot: sale-confirmation
- tapOn: "Annuler"
- assertVisible: "Vendre — Gants de boxe dorés"
- tapOn: "Vendre — Gants de boxe dorés"
- tapOn: "Confirmer la vente"
- extendedWaitUntil:
    visible: ".*Exemplaire vendu.*10 pièces.*"
    timeout: 15000
- assertNotVisible: "Vendre — Gants de boxe dorés"
- takeScreenshot: sale-last-unit
- scrollUntilVisible:
    element:
      text: ".*Torse.*"
    direction: UP
- tapOn: ".*Torse.*"
- scrollUntilVisible:
    element:
      text: "Vendre — T-shirt sportif — Ardoise"
    direction: DOWN
- tapOn: "Vendre — T-shirt sportif — Ardoise"
- tapOn: "Confirmer la vente"
- extendedWaitUntil:
    visible: "Retire cet objet avant de vendre son dernier exemplaire."
    timeout: 15000
- assertVisible: "ÉQUIPÉ"
- takeScreenshot: sale-equipped-duplicate
- assertNotVisible: "Vendre — T-shirt sportif — Ardoise"
- scrollUntilVisible:
    element:
      text: "Ouvrir"
    direction: DOWN
- assertNotVisible: "Vendre — Coffre en bois"
- takeScreenshot: sale-chest-excluded
- runFlow: inventory-sale-ledger.yaml
