appId: app.grrind.dev
---
# E2E_OFFLINE=1; node scripts/combat-presentation-server.mjs for the frozen effects.
- launchApp
- setOrientation: PORTRAIT
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - extendedWaitUntil:
          visible: Close
          timeout: 5000
      - tapOn: Close
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
# Preserve the existing QA session and dismiss its already-credited reward pages.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible: ".*Toucher pour (voir|continuer).*"
          commands:
            - tapOn: ".*Toucher pour (voir|continuer).*"
            - waitForAnimationToEnd:
                timeout: 2000
# Auth restoration can replace a deep link opened before the navigation stack is mounted.
- extendedWaitUntil:
    visible:
      id: "login-email|tab-accueil|quaternius-ready|pebble-idle|battle-combat|battle-exit"
    timeout: 30000
- runFlow:
    file: combat-effect-frame.yaml
    env:
      EFFECT: critical-player
- runFlow:
    file: combat-effect-frame.yaml
    env:
      EFFECT: critical-enemy
- runFlow:
    file: combat-effect-frame.yaml
    env:
      EFFECT: dodge-player
- runFlow:
    file: combat-effect-frame.yaml
    env:
      EFFECT: dodge-enemy
- runFlow:
    file: combat-effect-frame.yaml
    env:
      EFFECT: combo-player
- runFlow:
    file: combat-effect-frame.yaml
    env:
      EFFECT: combo-enemy
- runFlow:
    file: combat-effect-frame.yaml
    env:
      EFFECT: replay-player
- runFlow:
    file: combat-effect-frame.yaml
    env:
      EFFECT: replay-enemy
# Presentation limit: no fabricated KO or reward.
- openLink: grrindapp-dev://combat-demo?network=limit&opponent=player
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 15000
- takeScreenshot: unity-limit-verdict
- tapOn:
    id: battle-exit
# The long fixture leaves enough time to exercise skip without a late tap on Continue.
- openLink: grrindapp-dev://combat-demo?network=long&opponent=player
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- tapOn: Passer
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 5000
- takeScreenshot: unity-skip-verdict
- tapOn:
    id: battle-exit
# Natural PvP playback at x2, then the detailed server recap.
- openLink: grrindapp-dev://combat-demo?scenario=duel&snapshot=avatar
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- tapOn: Vitesse ×2
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 45000
- takeScreenshot: unity-pvp-natural-victory
- tapOn:
    id: battle-details
- assertVisible: Coups portés
- takeScreenshot: unity-pvp-details
- tapOn:
    id: battle-exit
- openLink: grrindapp-dev://combat-demo?scenario=duel&snapshot=avatar&at=3200
- runFlow:
    when:
      visible: "Ouvrir dans.*"
    commands:
      - tapOn: Ouvrir
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: unity-renderer-ready
- assertNotVisible:
    id: battle-renderer-unavailable
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - extendedWaitUntil:
          visible: Close
          timeout: 5000
      - tapOn: Close
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- takeScreenshot: unity-snapshot-pvp
- tapOn:
    id: battle-combat
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 10000
- takeScreenshot: unity-default-pvp-recap
- tapOn:
    id: battle-exit
- extendedWaitUntil:
    visible:
      id: pebble-idle
    timeout: 15000
- takeScreenshot: unity-return-portrait
- setOrientation: PORTRAIT
# Reopen the same frozen battle, with no workshop/profile configuration overrides.
- openLink: grrindapp-dev://combat-demo?scenario=duel&snapshot=avatar&at=3200
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: unity-renderer-ready
- takeScreenshot: unity-snapshot-pvp-replay
- tapOn:
    id: battle-combat
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 10000
- tapOn:
    id: battle-exit
- extendedWaitUntil:
    visible:
      id: pebble-idle
    timeout: 15000
- setOrientation: PORTRAIT
- openLink: grrindapp-dev://combat-demo?scenario=victoire&mob=pebble&at=1494
- extendedWaitUntil:
    visible:
      id: battle-dialogue
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: battle-dialogue
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 10000
- assertVisible:
    id: unity-renderer-ready
- takeScreenshot: unity-cailloux-attack
- tapOn:
    id: battle-combat
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 10000
- tapOn:
    id: battle-exit
- extendedWaitUntil:
    visible:
      id: pebble-idle
    timeout: 15000
- setOrientation: PORTRAIT
- openLink: grrindapp-dev://combat-demo?scenario=defaiteBoss&mob=pebble&at=2794
- extendedWaitUntil:
    visible:
      id: battle-dialogue
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: battle-dialogue
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 10000
- assertVisible:
    id: unity-renderer-ready
- takeScreenshot: unity-cailloux-counter
- tapOn:
    id: battle-combat
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 10000
- takeScreenshot: unity-cailloux-defeat-recap
- tapOn:
    id: battle-exit
- extendedWaitUntil:
    visible:
      id: pebble-idle
    timeout: 15000
- setOrientation: PORTRAIT
- openLink: grrindapp-dev://avatar-3d
- extendedWaitUntil:
    visible:
      id: quaternius-ready
    timeout: 30000
- takeScreenshot: unity-workshop-after-combats
- setOrientation: PORTRAIT
- openLink: grrindapp-dev://combat-demo?mob=pebble
- extendedWaitUntil:
    visible:
      id: pebble-idle
    timeout: 30000
- takeScreenshot: unity-cailloux-menu
- tapOn: Jouer une victoire
- extendedWaitUntil:
    visible:
      id: battle-dialogue
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: battle-dialogue
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 10000
- assertVisible:
    id: unity-renderer-ready
- takeScreenshot: unity-cailloux-playing
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 90000
- takeScreenshot: unity-cailloux-natural-recap
- tapOn:
    id: battle-exit
- extendedWaitUntil:
    visible:
      id: pebble-idle
    timeout: 15000

# Direct scenario navigation avoids coupling the defeat check to menu scroll position.
- openLink: grrindapp-dev://combat-demo?scenario=defaiteBoss&mob=pebble
- extendedWaitUntil:
    visible:
      id: battle-dialogue
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- tapOn:
    id: battle-dialogue
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 90000
- takeScreenshot: unity-natural-defeat
- tapOn:
    id: battle-details
- assertVisible: Défaite
- takeScreenshot: unity-defeat-details
- tapOn:
    id: battle-exit
- extendedWaitUntil:
    visible:
      id: pebble-idle
    timeout: 15000
- setOrientation: PORTRAIT
