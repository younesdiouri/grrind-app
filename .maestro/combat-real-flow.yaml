appId: app.grrind.e2e
---
- runFlow: combat-round.yaml

# La ligne d'historique porte les pièces, jamais les objets (#227) — voir le docblock de
# `coinsGained` sur `BattleRow`. Elle est sous le catalogue, hors cadre sans défiler.
- scrollUntilVisible:
    element:
      id: "battle-history-row"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 05-combat-history-coins
- tapOn:
    id: "battle-history-row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "battle-(dialogue|combat)"
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- runFlow:
    when:
      visible: ".*Toucher pour combattre.*"
    commands:
      - tapOn:
          id: "battle-dialogue"
- extendedWaitUntil:
    visible: ".*Touche pour revenir.*"
    timeout: 30000
- assertVisible: ".*Victoire.*"
- takeScreenshot: 05a-battle-replay
- tapOn:
    id: "battle-exit"
- extendedWaitUntil:
    visible: "Anciens combats"
    timeout: 15000
- takeScreenshot: portrait-replay-before-device-reset
- setOrientation: PORTRAIT
- swipe:
    start: "2%, 55%"
    end: "95%, 55%"
