appId: app.grrind.dev
---
- launchApp
- runFlow: alam-session.yaml
- openLink: grrindapp-dev://inventaire
- extendedWaitUntil:
    visible:
      id: character-tab-equipment
    timeout: 30000
# La recette des anciens gantelets a été retirée avec le catalogue sans modèle 3D.
- scrollUntilVisible:
    element:
      id: character-tab-bag
    direction: UP
    timeout: 20000
- tapOn:
    id: character-tab-bag
- assertVisible: RESSOURCES
- assertVisible: "Ressource · atelier"
- assertNotVisible: "Équiper — Essence du Nafs"
- takeScreenshot: alam-resources-inventory
