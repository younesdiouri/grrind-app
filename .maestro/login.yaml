appId: app.grrind.dev
---
# Le sous-flow de connexion, partagé par les deux scénarios du smoke test.
#
# La variante E2E choisit son jeu de données de santé sur l'adresse saisie ici : une adresse
# qui contient `-empty-` donne un fournisseur sans séance, toutes les autres en donnent
# quatre. C'est `src/features/health/e2e.ts` qui tranche, et seulement dans un bundle
# construit avec `EXPO_PUBLIC_E2E=1`.
#
# Après une réinstallation, iOS demande « Ouvrir dans « GRRIND dev » ? » pour le lien Metro, et
# l'alerte arrive parfois après le contrôle qui suit `launchApp` : elle masque alors le formulaire.
# On attend donc l'un ou l'autre, puis on la referme si c'est elle.
- extendedWaitUntil:
    visible: "Ouvrir dans.*|Plus tard|Se connecter"
    timeout: 30000
- runFlow:
    when:
      visible: "Ouvrir dans.*"
    commands:
      # La préparation et le flow peuvent avoir chacun ouvert le lien Metro : iOS présente
      # alors plusieurs confirmations consécutives après une première installation.
      - repeat:
          times: 3
          while:
            visible: "Ouvrir dans.*"
          commands:
            - tapOn: "Ouvrir"
- runFlow:
    when:
      visible: "Plus tard"
    commands:
      - tapOn: "Plus tard"
- extendedWaitUntil:
    visible: "Se connecter"
    timeout: 30000
- tapOn:
    id: "login-email"
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- eraseText
- inputText: ${PASSWORD}
- tapOn: "Se connecter"

# iOS propose d'enregistrer le mot de passe dans le trousseau. L'alerte est système, elle
# n'appartient pas à l'app, et elle n'apparaît pas à tous les coups : on la referme si elle
# est là, on ne l'attend pas.
- runFlow:
    when:
      visible: "Plus tard"
    commands:
      - tapOn: "Plus tard"
