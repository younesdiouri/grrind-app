appId: app.grrind.dev
tags:
  - ios
  - inventory
---
# Deux comptes jetables de la même guilde, équipés de gants de boxe, t-shirt et jambes Unity.
# Les identifiants MAESTRO_INVENTORY_EMAIL/PASSWORD restent hors Git.
- launchApp
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - tapOn: "Close"
- runFlow:
    file: login.yaml
    env:
      EMAIL: ${MAESTRO_INVENTORY_EMAIL}
      PASSWORD: ${MAESTRO_INVENTORY_PASSWORD}
- extendedWaitUntil:
    visible: "NIVEAU|.*Toucher pour continuer.*"
    timeout: 90000
- runFlow:
    when:
      visible: ".*Toucher pour continuer.*"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    visible: "NIVEAU"
    timeout: 15000
- tapOn:
    id: "tab-inventaire"
- extendedWaitUntil:
    visible:
      id: "character-tab-statistics"
    timeout: 15000
- takeScreenshot: inventory-equipped-board
- tapOn:
    id: "character-tab-statistics"
- assertVisible: '.*Force.*\+0 équipement.*'
- takeScreenshot: inventory-equipped-statistics
- tapOn:
    id: "character-tab-equipment"
- scrollUntilVisible:
    element:
      text: ".*Arme.*"
    direction: DOWN
- tapOn: ".*Arme.*"
- scrollUntilVisible:
    element:
      id: inventory-item-GOLDEN_BOXING_GLOVES
    direction: DOWN
- tapOn:
    id: inventory-item-GOLDEN_BOXING_GLOVES
- scrollUntilVisible:
    element:
      text: "Retirer — Gants de boxe dorés"
    direction: DOWN
- tapOn: "Retirer — Gants de boxe dorés"
- extendedWaitUntil:
    visible: ".*Équiper — Gants de boxe dorés.*"
    timeout: 15000
- tapOn: Fermer la fiche
- scrollUntilVisible:
    element:
      id: "character-tab-statistics"
    direction: UP
- tapOn:
    id: "character-tab-statistics"
- assertVisible: '.*Force.*\+0 équipement.*'
- takeScreenshot: inventory-unequipped-statistics
- tapOn:
    id: "character-tab-equipment"
- scrollUntilVisible:
    element:
      id: inventory-item-GOLDEN_BOXING_GLOVES
    direction: DOWN
- tapOn:
    id: inventory-item-GOLDEN_BOXING_GLOVES
- scrollUntilVisible:
    element:
      text: ".*Équiper — Gants de boxe dorés.*"
    direction: DOWN
- tapOn: ".*Équiper — Gants de boxe dorés.*"
- extendedWaitUntil:
    notVisible: Fermer la fiche
    timeout: 15000
- assertVisible: "Gants de boxe dorés,.*, équipé"
- takeScreenshot: inventory-reequipped-item
- scrollUntilVisible:
    element:
      id: "character-tab-statistics"
    direction: UP
- tapOn:
    id: "character-tab-statistics"
- assertVisible: '.*Force.*\+0 équipement.*'
- takeScreenshot: inventory-reequipped-statistics
- tapOn:
    id: "tab-guilde"
- scrollUntilVisible:
    element:
      text: ".*QA Equipements.*"
    direction: DOWN
    timeout: 30000
- tapOn: ".*QA Equipements.*"
- extendedWaitUntil:
    visible: "QA Equipements"
    timeout: 15000
- takeScreenshot: player-circles
- scrollUntilVisible:
    element:
      id: "character-tab-statistics"
    direction: DOWN
- tapOn:
    id: "character-tab-statistics"
- scrollUntilVisible:
    element:
      id: "attribute-dexterity"
    direction: DOWN
- takeScreenshot: player-statistics
- assertNotVisible:
    id: shop-entry
- scrollUntilVisible:
    element:
      id: "stat-dodgePercent"
    direction: DOWN
- takeScreenshot: player-combat-statistics
- scrollUntilVisible:
    element:
      id: "stat-precisionPercent"
    direction: DOWN
- takeScreenshot: player-combat-statistics-end
- scrollUntilVisible:
    element:
      id: "character-tab-equipment"
    direction: UP
- tapOn:
    id: "character-tab-equipment"
- scrollUntilVisible:
    element:
      text: "Gants de boxe dorés"
    direction: DOWN
- takeScreenshot: player-equipment-readonly
- assertNotVisible: "Retirer"
- assertNotVisible: "Vendre.*"
- scrollUntilVisible:
    element:
      id: "character-tab-bag"
    direction: UP
- tapOn:
    id: "character-tab-bag"
- scrollUntilVisible:
    element:
      text: "Gants de boxe dorés"
    direction: DOWN
- takeScreenshot: player-bag-readonly
- assertNotVisible: "Valeur"
- assertNotVisible: "Vendre.*"
- assertNotVisible: "Ouvrir"

- swipe:
    start: "2%, 55%"
    end: "95%, 55%"
- tapOn:
    id: "tab-combat"
- extendedWaitUntil:
    visible: "Adversaires"
    timeout: 15000
- takeScreenshot: final-combat-catalog
- tapOn:
    id: "open-bag"
- assertVisible:
    id: "character-tab-equipment"
- tapOn:
    id: "tab-reglages"
- assertVisible: "Autorisations Santé"
- takeScreenshot: final-settings-health
- scrollUntilVisible:
    element:
      text: "Ouvrir Santé"
    direction: DOWN
- tapOn: "Ouvrir Santé"
- extendedWaitUntil:
    visible: "Santé"
    timeout: 15000
- takeScreenshot: final-health
