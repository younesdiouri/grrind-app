appId: app.grrind.dev
---
# Même équipement dans les réglages, le profil public et après relancement.
- openLink: grrindapp-dev://inventaire
- tapOn:
    id: tab-reglages
- scrollUntilVisible:
    element:
      id: combat-avatar-ready
    direction: DOWN
    centerElement: true
- assertVisible: "Personnage équipé :.*Corail.*Cyan.*Gants de boxe dorés"
- takeScreenshot: avatar-settings
- openLink: grrindapp-dev://joueur/${MAESTRO_AVATAR_PLAYER_ID}
- extendedWaitUntil:
    visible:
      id: character-tab-equipment
    timeout: 15000
- scrollUntilVisible:
    element:
      id: combat-avatar-ready
    direction: DOWN
    centerElement: true
- assertVisible: "Personnage équipé :.*Corail.*Cyan.*Gants de boxe dorés"
- assertNotVisible: Retirer
- takeScreenshot: avatar-public-profile
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-inventaire
    timeout: 30000
- tapOn:
    id: tab-inventaire
- scrollUntilVisible:
    element:
      id: combat-avatar-ready
    direction: DOWN
    centerElement: true
- assertVisible: "Personnage équipé :.*Corail.*Cyan.*Gants de boxe dorés"
- takeScreenshot: avatar-after-relaunch
