appId: app.grrind.dev
---
# Récompense fixe avec objet : exige une session, appelé par appearances.yaml.
- openLink: grrindapp-dev://battle?fixture=victoireAvecLoot
- extendedWaitUntil:
    visible:
      id: battle-dialogue
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- tapOn:
    id: battle-dialogue
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 90000
- tapOn:
    id: battle-details
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            notVisible: ".*Bourse.*"
          commands:
            - swipe:
                from:
                  id: battle-recap-scroll
                direction: UP
- assertVisible: ".*Bourse.*"
- takeScreenshot: recap-loot-scrolled
- tapOn:
    id: battle-exit
- setOrientation: PORTRAIT
