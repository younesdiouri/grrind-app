appId: app.grrind.dev
---
# Continuation du parcours de vente, avec ses crédits de 10 et 5 pièces.
- scrollUntilVisible:
    element:
      text: "BOURSE"
    direction: UP
- tapOn: "BOURSE"
- extendedWaitUntil:
    visible: "SOLDE"
    timeout: 15000
- assertVisible: ".*Vente.*"
- assertVisible: ".*10 pièces.*"
- takeScreenshot: sale-coin-ledger
