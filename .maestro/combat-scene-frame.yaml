appId: app.grrind.dev
---
- openLink: grrindapp-dev://combat-demo?scenario=${SCENARIO}&mob=pebble&at=${AT}
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible: "Ouvrir dans.*"
          commands:
            - tapOn: "Ouvrir"
- extendedWaitUntil:
    visible: ".*Toucher pour combattre.*"
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- tapOn:
    id: "battle-dialogue"
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 10000
- takeScreenshot: ${NAME}
