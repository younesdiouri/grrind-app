appId: app.grrind.dev
tags:
  - ios
  - inventory
---
# Suite du parcours inventory-profile : session QA conservée, gantelets en plusieurs
# exemplaires et coffre disponibles. À lancer avec E2E_OFFLINE=1 pour garder la session.
- launchApp
- swipe:
    start: "2%, 55%"
    end: "95%, 55%"
- tapOn:
    id: "hud-inventory"
- scrollUntilVisible:
    element:
      id: "character-tab-bag"
    direction: UP
- tapOn:
    id: "character-tab-bag"
- scrollUntilVisible:
    element:
      id: inventory-item-GOLDEN_BOXING_GLOVES
    direction: DOWN
- tapOn:
    id: inventory-item-GOLDEN_BOXING_GLOVES
- scrollUntilVisible:
    element:
      text: "Vendre.*"
    direction: DOWN
- tapOn:
    text: "Vendre.*"
    index: 0
- assertVisible: "Vendre un exemplaire ?"
- takeScreenshot: bag-sale-confirmation
- tapOn: "Annuler"
- tapOn:
    text: "Vendre.*"
    index: 0
- tapOn: "Confirmer la vente"
- runFlow:
    when:
      visible: Fermer la fiche
    commands:
      - tapOn: Fermer la fiche
- scrollUntilVisible:
    element:
      text: "Exemplaire vendu.*"
    direction: UP
- takeScreenshot: bag-sale-complete
- scrollUntilVisible:
    element:
      text: "Coffre en bois,.*"
    direction: DOWN
    timeout: 60000
- tapOn: "Coffre en bois,.*"
- scrollUntilVisible:
    element:
      text: "Ouvrir — Coffre en bois"
    direction: DOWN
- tapOn: "Ouvrir — Coffre en bois"
- scrollUntilVisible:
    element:
      text: "CONTENU DU COFFRE"
    direction: DOWN
- takeScreenshot: bag-chest-opened
- tapOn: Fermer la fiche
- tapOn:
    id: "tab-accueil"
- tapOn:
    id: "hud-bag"
- scrollUntilVisible:
    element:
      id: "character-tab-bag"
    direction: UP
- takeScreenshot: home-inventory-entry
