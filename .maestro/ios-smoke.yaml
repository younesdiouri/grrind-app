appId: app.grrind.e2e
tags:
  - smoke
  - ios
---
# ————— Ce que ce flow prouve ————————————————————————————————————————————————————————————
#
# Deux comptes neufs, deux jeux de données de santé déterministes, et la chaîne complète entre
# les deux : connexion, synchronisation, crédit, mise en scène, historique.
#
# ————— Deux règles de Maestro qu'on paye si on les oublie ————————————————————————————————
#
# **Le texte se compare en entier.** `"Accueil"` ne trouve pas un onglet dont iOS a composé le
# libellé en « Accueil, tab, 1 of 5 ». D'où les `id:` sur la barre d'onglets — posés par
# `tabBarButtonTestID` — et les `.*` là où le libellé porte plus que ce qu'on cherche.
#
# **L'écran de récompense est un seul élément.** Il est enveloppé dans un `Pressable`, qui
# agrège l'accessibilité de tous ses enfants en une phrase unique. On y cherche donc des
# fragments, jamais un texte exact.

- launchApp

# Le development build affiche son onboarding natif après chaque `clearState`. Le build Release
# ne l'affiche pas : cette branche conditionnelle ne change donc pas le parcours full.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Close"
          timeout: 5000
      - tapOn: "Close"

# ————— Scénario « aucune séance » ————————————————————————————————————————————————————————

- runFlow:
    file: login.yaml
    env:
      EMAIL: ${EMPTY_EMAIL}

- extendedWaitUntil:
    visible: "NIVEAU"
    timeout: 30000
- assertVisible: "Aucune séance"
- takeScreenshot: 01-empty-home

- tapOn:
    id: "tab-sante"
- extendedWaitUntil:
    visible: "Aucune activité trouvée"
    timeout: 30000
- takeScreenshot: 02-empty-health

# ————— Combat (#227) — le combattant du joueur, un combat gagné, son butin ————————————————
#
# `SAND_JACKAL` est le seul adversaire accessible à un compte neuf, et le socle livré le bat
# toujours — `CombatCoverageTest::testTheShippedFighterSocleWinsTheLevelOneEncounter` le
# garantit côté back. La victoire est donc déterministe ; le butin exact (`loot.yaml`, table
# `SAND_JACKAL`) ne l'est pas, sauf la bourse, dont la borne basse n'est jamais nulle — c'est
# elle qu'on vérifie, jamais un objet précis qui pourrait ne pas tomber.

- tapOn:
    id: "tab-combat"
- extendedWaitUntil:
    visible: "Adversaires"
    timeout: 15000
- assertVisible: "Toi"
- takeScreenshot: 03-combat-catalog

- tapOn: "Combattre"
- extendedWaitUntil:
    visible: ".*Chacal des sables.*"
    timeout: 15000

# Le combat, joué : ce sont les deux combattants qui paraissent avec leurs valeurs, avant même
# le premier coup — pas d'attente du verdict naturel, qui prendrait jusqu'au budget de
# `buildBattleTimeline` (quatorze secondes). Un tap saute directement à la fin, exactement le
# geste qu'un joueur ferait.
- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible: ".*Touche pour revenir.*"
    timeout: 10000
- assertVisible: ".*Victoire.*"
- assertVisible: ".*Bourse.*"
- takeScreenshot: 04-battle-recap-loot

- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible: "Adversaires"
    timeout: 15000

# La ligne d'historique porte les pièces, jamais les objets (#227) — voir le docblock de
# `coinsGained` sur `BattleRow`. Elle est sous le catalogue, hors cadre sans défiler.
- scrollUntilVisible:
    element:
      text: ".*pièce.*"
    direction: DOWN
- takeScreenshot: 05-combat-history-coins

- tapOn:
    id: "tab-reglages"
- scrollUntilVisible:
    element:
      text: "Se déconnecter"
    direction: DOWN
- tapOn: "Se déconnecter"
- extendedWaitUntil:
    visible: "Connexion"
    timeout: 15000

# ————— Scénario « plusieurs séances » ————————————————————————————————————————————————————
#
# Quatre séances sont lisibles, trois tombent dans la fenêtre d'import : la quatrième a
# quarante-cinq jours et prouve que la fenêtre est bien celle du client.
#
# **Un processus neuf, et ce n'est pas du confort.** Le coordinateur de synchronisation refuse
# une seconde tentative dans les trente secondes qui suivent la précédente, et son horloge est
# un singleton de module que la déconnexion n'efface pas. Enchaîner les deux sessions dans le
# même processus ferait dépendre l'import du second compte du temps qu'a pris le premier
# scénario — sous les trente secondes, rien ne part et rien ne le dit.

- stopApp
- launchApp

- runFlow:
    file: login.yaml
    env:
      EMAIL: ${MULTIPLE_EMAIL}

- extendedWaitUntil:
    visible: ".*Toucher pour continuer.*"
    timeout: 90000
- assertVisible: ".*3 séances.*"
- assertVisible: ".*Premiers pas.*"
- takeScreenshot: 06-reward-summary

# La mise en scène a pris l'écran toute seule, et c'est la règle : `mayOpenReward` laisse
# passer tant que personne n'a touché la coquille de l'app depuis le lancement. Le formulaire
# de connexion vit **hors** de cette coquille — c'est pour ça qu'y taper ne compte pas, et que
# le joueur qui se connecte voit sa progression tout de suite plutôt qu'au lancement suivant.

- tapOn:
    point: "50%,50%"
- extendedWaitUntil:
    visible: "NIVEAU"
    timeout: 20000
- assertVisible: "3 séances.*"
- takeScreenshot: 07-multiple-history

# ————— Le sac (#30) — les deux entrées, et le combattant qui suit ————————————————————————
#
# Le second compte vient de créditer trois séances : il a donc des pièces à coup sûr — la bande
# de `STARTER_SESSION_DROP` n'a pas de borne basse nulle — mais **pas forcément un objet**, qui
# ne tombe que trois fois sur dix par séance créditée. Ce qui est certain se prouve sans
# condition ; l'équipement, seulement s'il y a de quoi.
#
# **Le parcours passe par l'onglet Combat, et ce n'est pas un raccourci.** C'est la seule façon
# d'avoir un avant et un après du **même** combattant : le catalogue se capture, on ouvre le sac
# depuis lui, on équipe, on revient. Sans l'avant, « les chiffres ont changé » n'est pas une
# preuve, c'est une affirmation.

# L'entrée de l'accueil existe et porte son résumé — c'est tout ce qu'on lui demande ici.
- assertVisible:
    id: "bag-row"

- tapOn:
    id: "tab-combat"
- extendedWaitUntil:
    visible: "Toi"
    timeout: 15000
- takeScreenshot: 08-fighter-before

# La seconde entrée : on change d'équipement là où l'on voit les chiffres qu'il va déplacer.
- tapOn:
    id: "open-bag"
- extendedWaitUntil:
    visible: "BOURSE"
    timeout: 15000
# Les sept emplacements sont toujours là, vides compris : c'est la moitié de ce que cet écran
# montre, et le contrat les sert précisément pour qu'on n'ait pas à distinguer « pas chargé »
# de « rien ici ».
- assertVisible: ".*Tête.*"
- assertVisible: ".*Arme.*"
- takeScreenshot: 09-bag

# La bourse a une histoire (#129), et c'est le bloc du solde qui l'ouvre. Elle est **toujours**
# garnie ici : les trois séances créditées ont chacune fait tomber des pièces, la bande de
# `STARTER_SESSION_DROP` n'ayant pas de borne basse nulle. Contrairement au loot, rien à
# conditionner.
- tapOn: "BOURSE"
- extendedWaitUntil:
    visible: "SOLDE"
    timeout: 15000
- assertVisible: ".*Séance créditée.*"
- takeScreenshot: 09b-coin-ledger

# Et on revient au sac pour la suite — par le geste de bord, comme plus bas : `back` ne replie
# pas la pile depuis une vue défilante.
- swipe:
    start: "2%, 55%"
    end: "95%, 55%"
- extendedWaitUntil:
    visible: "BOURSE"
    timeout: 15000

# On déroule **avant** de conditionner : `when: visible` ne voit que ce qui est à l'écran, et le
# bouton d'un objet vit sous la doublure. Sans ce défilement, un sac garni se testait comme un
# sac vide — la branche était sautée alors qu'il y avait de quoi la jouer.
- scrollUntilVisible:
    element:
      text: ".*Équiper.*"
    direction: DOWN
    optional: true

- runFlow:
    when:
      visible: ".*Équiper.*"
    commands:
      - tapOn: ".*Équiper.*"
      - extendedWaitUntil:
          visible: "ÉQUIPÉ"
          timeout: 15000
      - takeScreenshot: 10-bag-equipped

      # Le retour par le geste de bord, et non par `back` : depuis une vue défilante qu'on
      # vient de parcourir, le raccourci de Maestro n'a pas replié la pile — on restait sur le
      # sac, à chercher une barre d'onglets qu'il cachait.
      - swipe:
          start: "2%, 55%"
          end: "95%, 55%"
      - extendedWaitUntil:
          visible: "Adversaires"
          timeout: 15000

      # Et le combattant a suivi, sans qu'on ait rien rechargé à la main : l'onglet n'a jamais
      # été démonté, c'est le compteur d'équipement qui lui a fait relire son catalogue. La
      # comparaison se fait avec `08-fighter-before`, même compte, même écran.
      - takeScreenshot: 11-fighter-after-equip
