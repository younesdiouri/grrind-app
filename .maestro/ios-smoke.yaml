appId: app.grrind.e2e
tags:
  - smoke
  - ios
---
# ————— Ce que ce flow prouve ————————————————————————————————————————————————————————————
#
# Un compte neuf : connexion, accueil, un combat et retour.
# Santé, inventaire et rejeu ont leurs propres flows ciblés.
#
# ————— Deux règles de Maestro qu'on paye si on les oublie ————————————————————————————————
#
# **Le texte se compare en entier.** `"Accueil"` ne trouve pas un onglet dont iOS a composé le
# libellé en « Accueil, tab, 1 of 5 ». D'où les `id:` sur la barre d'onglets — posés par
# `tabBarButtonTestID` — et les `.*` là où le libellé porte plus que ce qu'on cherche.
#
# **L'écran de récompense est un seul élément.** Il est enveloppé dans un `Pressable`, qui
# agrège l'accessibilité de tous ses enfants en une phrase unique. On y cherche donc des
# fragments, jamais un texte exact.

- launchApp

# iOS peut demander confirmation pour ouvrir le lien Metro après une réinstallation.
- runFlow:
    when:
      visible: "Ouvrir dans.*"
    commands:
      - tapOn: "Ouvrir"

# Après `clearState`, fermer conditionnellement l’onboarding du development build.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Close"
          timeout: 5000
      - tapOn: "Close"

- runFlow:
    file: login.yaml
    env:
      EMAIL: ${EMPTY_EMAIL}

- extendedWaitUntil:
    visible: "NIVEAU"
    timeout: 30000
- assertVisible: "Aucune séance"
- takeScreenshot: 01-empty-home


- runFlow: combat-round.yaml
- takeScreenshot: 03-portrait-return
