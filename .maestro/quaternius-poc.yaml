appId: app.grrind.dev
---
# Standalone POC, E2E_OFFLINE=1. No backend account or equipment mutation.
- launchApp
- setOrientation: PORTRAIT
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- openLink: grrindapp-dev://character-showcase
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible: "Ouvrir dans.*"
          commands:
            - tapOn: "Ouvrir"
- extendedWaitUntil:
    visible:
      id: quaternius-ready
    timeout: 30000
- tapOn: Mouvements
- tapOn: Figer
- tapOn: Visage
- tapOn: Traits
