appId: app.grrind.dev
---
- openLink: grrindapp-dev://alam-demo?at=${AT}
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible: "Ouvrir dans.*"
          commands:
            - tapOn: "Ouvrir"
- extendedWaitUntil:
    visible: "DÉMONSTRATION · AUCUN GAIN RÉEL"
    timeout: 15000
- assertVisible: Younes
- takeScreenshot: ${NAME}
