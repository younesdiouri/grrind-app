appId: app.grrind.dev
tags:
  - combat
  - ios
---
# Serveur HTTP synthétique local, pas le catalogue réel : voir scripts/combat-presentation-server.mjs.
- launchApp
- setOrientation: PORTRAIT
- runFlow:
    file: combat-presentation-dialogue.yaml
    env:
      SCENARIO: complete
- runFlow:
    file: combat-presentation-dialogue.yaml
    env:
      SCENARIO: dialogue
- runFlow:
    file: combat-presentation-dialogue.yaml
    env:
      SCENARIO: missing
- runFlow:
    file: combat-presentation-dialogue.yaml
    env:
      SCENARIO: slow
- openLink: grrindapp-dev://combat-demo?network=silent
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- assertNotVisible: ".*Toucher pour combattre.*"
- takeScreenshot: presentation-silent
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 90000
- tapOn:
    id: "battle-exit"
- setOrientation: PORTRAIT
- openLink: grrindapp-dev://combat-demo?network=legacy
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- assertNotVisible: ".*Toucher pour combattre.*"
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 90000
- tapOn:
    id: "battle-exit"
- setOrientation: PORTRAIT
- assertVisible:
    id: pebble-idle
