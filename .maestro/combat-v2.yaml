appId: app.grrind.e2e
tags:
  - combat
  - ios
---
# Serveur synthétique local ; frames figées uniquement dans la démo E2E.
- launchApp
- openLink: "grrindapp-e2e://combat-demo?network=effects&frame=dodge-player"
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- takeScreenshot: v2-dodge-player
- tapOn:
    point: "50%,70%"
- extendedWaitUntil:
    visible: ".*Touche pour revenir.*"
    timeout: 5000
