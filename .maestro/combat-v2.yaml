appId: app.grrind.dev
tags:
  - ios
  - combat
---
# Huit poses/effets, lecture ×2/Passer et butin défilant avec retour au portrait.
- launchApp
- setOrientation: PORTRAIT
- runFlow:
    when:
      visible: "Ouvrir dans.*"
    commands:
      - tapOn: "Ouvrir"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Close"
          timeout: 5000
      - tapOn: "Close"
- runFlow:
    file: login.yaml
    env:
      EMAIL: ${EMPTY_EMAIL}
- extendedWaitUntil:
    visible: "NIVEAU"
    timeout: 30000
# Les huit poses et effets sont figés pour comparer leur camp et lire les captures.
- openLink: "grrindapp-dev://combat-demo?network=effects&opponent=player&frame=dodge-player"
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- assertNotVisible: ".*ENCAISSES?.*"
- takeScreenshot: feedback-dodge-player
- openLink: "grrindapp-dev://combat-demo?network=effects&opponent=player&frame=dodge-enemy"
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- assertNotVisible: ".*ENCAISSES?.*"
- takeScreenshot: feedback-dodge-enemy
- openLink: "grrindapp-dev://combat-demo?network=effects&opponent=player&frame=critical-player"
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- assertNotVisible: ".*ENCAISSES?.*"
- takeScreenshot: feedback-critical-player
- openLink: "grrindapp-dev://combat-demo?network=effects&opponent=player&frame=critical-enemy"
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- assertNotVisible: ".*ENCAISSES?.*"
- takeScreenshot: feedback-critical-enemy
- openLink: "grrindapp-dev://combat-demo?network=effects&opponent=player&frame=combo-player"
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- assertNotVisible: ".*ENCAISSES?.*"
- takeScreenshot: feedback-combo-player
- openLink: "grrindapp-dev://combat-demo?network=effects&opponent=player&frame=combo-enemy"
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- assertNotVisible: ".*ENCAISSES?.*"
- takeScreenshot: feedback-combo-enemy
- openLink: "grrindapp-dev://combat-demo?network=effects&opponent=player&frame=replay-player"
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- assertNotVisible: ".*ENCAISSES?.*"
- takeScreenshot: feedback-replay-player
- openLink: "grrindapp-dev://combat-demo?network=effects&opponent=player&frame=replay-enemy"
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- assertNotVisible: ".*ENCAISSES?.*"
- takeScreenshot: feedback-replay-enemy
# Long scénario synthétique : laisse au pilote le temps de vérifier ×2 puis Passer.
- openLink: "grrindapp-dev://combat-demo?network=long&opponent=player"
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 15000
- setOrientation: LANDSCAPE_LEFT
- tapOn: "Vitesse ×2"
- assertVisible: "Passer"
- tapOn: "Passer"
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 5000
- takeScreenshot: feedback-playback-recap
- tapOn:
    id: battle-exit
- setOrientation: PORTRAIT
- assertVisible:
    id: pebble-idle
- runFlow: combat-recap-loot.yaml
