appId: app.grrind.e2e
tags:
  - combat
  - ios
  - duel
---
# Le geste du #176, de bout en bout : la guilde, le profil d'un co-équipier, le défi, et
# l'animation qui se joue avec le composant du PvE — c'est tout l'intérêt de la feature, et
# c'est la seule chose qu'un test unitaire ne peut pas montrer.
#
# Le jeu de données vient de `node scripts/seed-duel-qa.mjs` : deux comptes dans une même
# guilde, tous les deux présents.
- launchApp
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: "http://.*808[23]"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - tapOn: "Close"
- runFlow:
    file: login.yaml
    env:
      EMAIL: ${MAESTRO_DUEL_EMAIL}
      PASSWORD: ${MAESTRO_DUEL_PASSWORD}
- extendedWaitUntil:
    visible: "NIVEAU"
    timeout: 90000
- tapOn:
    id: "tab-guilde"
- extendedWaitUntil:
    visible: "QA Défis"
    timeout: 30000
- takeScreenshot: duel-00-guilde
# Maestro exige que la regex couvre **tout** le texte d'accessibilité de l'élément, et une
# ligne de membre s'annonce « QR, QA Rival, Niv. 1 » d'un seul bloc.
- tapOn: ".*QA Rival.*"
- extendedWaitUntil:
    visible: ".*Défier.*"
    timeout: 30000
- takeScreenshot: duel-01-profil
- tapOn: "Défier QA Rival"
# L'écran de combat, et pas le profil qu'on quitte : le nom du défié est visible sur les deux,
# donc c'est l'identifiant de l'écran qui fait foi. `battle-combat` est la séquence jouée —
# sans illustration, un défi n'a ni chargement d'images ni dialogue d'entrée.
- extendedWaitUntil:
    visible:
      id: "battle-combat"
    timeout: 60000
# Le nom du défié prend la place de celui d'un ennemi, sur le même composant.
- assertVisible: ".*QA Rival.*"
- takeScreenshot: duel-02-combat
