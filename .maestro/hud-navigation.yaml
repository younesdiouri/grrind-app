appId: app.grrind.dev
tags:
  - ios
  - navigation
---
# Un seul compte jetable vide, aucune mutation de jeu : liens et retours du HUD.
- launchApp
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - tapOn: Close
- runFlow:
    when:
      visible: Se connecter
    file: login.yaml
    env:
      EMAIL: ${EMPTY_EMAIL}
- extendedWaitUntil:
    visible: "NIVEAU|.*Toucher pour.*"
    timeout: 30000
- runFlow:
    when:
      visible: ".*Toucher pour voir le butin.*"
    commands:
      - tapOn: ".*Toucher pour voir le butin.*"
      - extendedWaitUntil:
          visible: ".*Toucher pour continuer.*"
          timeout: 30000
- runFlow:
    when:
      visible: ".*Toucher pour continuer.*"
    commands:
      - tapOn: ".*Toucher pour continuer.*"
- tapOn:
    id: tab-accueil
- extendedWaitUntil:
    visible: NIVEAU
    timeout: 30000
- assertVisible:
    id: hud-shop
- tapOn:
    id: hud-shop
- extendedWaitUntil:
    visible:
      id: shop-screen
    timeout: 15000
- assertVisible:
    id: hud-back
- assertNotVisible: LE COMPTOIR
- assertNotVisible: La boutique
- tapOn:
    id: hud-workshop
- extendedWaitUntil:
    visible: RECETTES
    timeout: 15000
- tapOn:
    id: hud-bag
- extendedWaitUntil:
    visible:
      id: inventory-filter-all
    timeout: 15000
- assertNotVisible:
    id: hud-back
- tapOn:
    id: tab-inventaire
- extendedWaitUntil:
    visible:
      id: equipment-slot-WEAPON
    timeout: 15000
- assertNotVisible:
    id: inventory-filter-all
- tapOn:
    id: hud-appearance
- extendedWaitUntil:
    visible: Fermer l’apparence
    timeout: 30000
- assertNotVisible: Mon apparence
- tapOn: Fermer l’apparence
- extendedWaitUntil:
    visible:
      id: equipment-slot-WEAPON
    timeout: 15000
- tapOn:
    id: hud-shop
- extendedWaitUntil:
    visible:
      id: shop-screen
    timeout: 15000
- tapOn:
    id: hud-back
- extendedWaitUntil:
    visible:
      id: equipment-slot-WEAPON
    timeout: 15000
- tapOn:
    id: tab-accueil
- assertVisible: NIVEAU
