appId: app.grrind.dev
---
# Sous-flow du parcours d’aperçu : sélectionner puis équiper un objet réellement possédé.
- scrollUntilVisible:
    element:
      id: character-tab-equipment
    direction: UP
- scrollUntilVisible:
    element:
      id: equipment-slot-${SLOT}
    direction: DOWN
    centerElement: true
- tapOn:
    id: equipment-slot-${SLOT}
- scrollUntilVisible:
    element:
      text: "${ITEM},.*"
    direction: DOWN
    centerElement: true
- tapOn: "${ITEM},.*"
- scrollUntilVisible:
    element:
      text: "Équiper — ${ITEM}"
    direction: DOWN
- tapOn: "Équiper — ${ITEM}"
- extendedWaitUntil:
    visible: "Retirer — ${ITEM}"
    timeout: 15000
- tapOn: Fermer la fiche
- scrollUntilVisible:
    element:
      id: combat-avatar-ready
    direction: UP
    centerElement: true
- assertVisible: "Personnage équipé :.*${ITEM}.*"

