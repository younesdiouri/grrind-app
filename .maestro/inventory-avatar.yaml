appId: app.grrind.dev
tags:
  - ios
  - inventory
---
# E2E_OFFLINE=1 conserve la session ; le compte QA jetable est provisionné par l’API normale.
# MAESTRO_AVATAR_EMAIL/MAESTRO_AVATAR_PLAYER_ID restent hors Git. Aucun reset de base.
- launchApp
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - tapOn: Close
- runFlow:
    file: login.yaml
    env:
      EMAIL: ${MAESTRO_AVATAR_EMAIL}
- extendedWaitUntil:
    visible: NIVEAU
    timeout: 30000
- tapOn:
    id: hud-inventory
- scrollUntilVisible:
    element:
      id: character-tab-equipment
    direction: DOWN
- tapOn:
    id: character-tab-equipment
- scrollUntilVisible:
    element:
      id: combat-avatar-ready
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible:
      id: combat-avatar-ready
    timeout: 20000
- assertNotVisible:
    id: equipment-slot-HANDS
- takeScreenshot: avatar-empty
- runFlow:
    file: inventory-avatar-equip.yaml
    env:
      SLOT: WEAPON
      ITEM: Haltère ego
- takeScreenshot: avatar-ego-equipped
- runFlow:
    file: inventory-avatar-equip.yaml
    env:
      SLOT: WEAPON
      ITEM: Le Poids Lourd
- takeScreenshot: avatar-weapon-replaced
- runFlow:
    file: inventory-avatar-equip.yaml
    env:
      SLOT: WEAPON
      ITEM: Gants de boxe dorés
- extendedWaitUntil:
    visible:
      id: combat-avatar-ready
    timeout: 20000
- takeScreenshot: avatar-gloves-replace-dumbbell
- runFlow:
    file: inventory-avatar-remove.yaml
    env:
      SLOT: WEAPON
      ITEM: Gants de boxe dorés
- extendedWaitUntil:
    visible:
      id: combat-avatar-ready
    timeout: 20000
- takeScreenshot: avatar-gloves-removed
- runFlow:
    file: inventory-avatar-equip.yaml
    env:
      SLOT: CHEST
      ITEM: T-shirt sportif — Corail
- runFlow:
    file: inventory-avatar-equip.yaml
    env:
      SLOT: LEGS
      ITEM: Les Guinzz — Cyan
- runFlow:
    file: inventory-avatar-equip.yaml
    env:
      SLOT: WEAPON
      ITEM: Gants de boxe dorés
- extendedWaitUntil:
    visible:
      id: combat-avatar-ready
    timeout: 20000
- takeScreenshot: avatar-six-slots-gloves
- runFlow: inventory-avatar-finish.yaml
