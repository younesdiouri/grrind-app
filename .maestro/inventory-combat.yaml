appId: app.grrind.dev
tags:
  - ios
  - combat
---
# Session du compte QA conservée après inventory-actions, contre le premier adversaire.
- launchApp
- tapOn:
    id: "tab-combat"
- scrollUntilVisible:
    element:
      text: "Combattre"
    direction: UP
- tapOn: "Combattre"
- extendedWaitUntil:
    visible:
      id: "battle-(dialogue|combat)"
    timeout: 15000
- takeScreenshot: final-enemy-presentation
- runFlow:
    when:
      visible: ".*Toucher pour combattre.*"
    commands:
      - tapOn:
          point: "50%,50%"
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 90000
- assertVisible: ".*Victoire.*"
- takeScreenshot: final-enemy-battle-recap
- tapOn:
    id: battle-exit
- assertVisible: "Adversaires"
