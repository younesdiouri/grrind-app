appId: app.grrind.dev
---
# Standalone presentation flow: E2E_OFFLINE=1. An existing QA session also checks previews.
- launchApp
- setOrientation: PORTRAIT
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - extendedWaitUntil:
          visible: Close
          timeout: 5000
      - tapOn: Close
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- openLink: grrindapp-dev://reglages
- extendedWaitUntil:
    visible: "Ton personnage|Se connecter"
    timeout: 30000
- setOrientation: PORTRAIT
- runFlow:
    when:
      visible: Ton personnage
    commands:
      - scrollUntilVisible:
          element:
            id: combat-avatar-ready
          direction: DOWN
          timeout: 30000
      - assertNotVisible:
          id: hero-picker
      - takeScreenshot: unity-settings-avatar
      - tapOn:
          id: tab-inventaire
      - scrollUntilVisible:
          element:
            id: character-tab-equipment
          direction: DOWN
      - tapOn:
          id: character-tab-equipment
      - extendedWaitUntil:
          visible:
            id: combat-avatar-ready
          timeout: 30000
      - takeScreenshot: unity-inventory-avatar
- runFlow: combat-3d.yaml
