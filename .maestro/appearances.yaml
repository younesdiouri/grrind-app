appId: app.grrind.dev
---
# Standalone presentation flow: E2E_OFFLINE=1. An existing QA session also checks previews.
- launchApp
- setOrientation: PORTRAIT
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - extendedWaitUntil:
          visible: Close
          timeout: 5000
      - tapOn: Close
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- openLink: grrindapp-dev://reglages
- extendedWaitUntil:
    visible: "Ton personnage|Se connecter"
    timeout: 30000
- setOrientation: PORTRAIT
- runFlow:
    when:
      visible: Ton personnage
    commands:
      - scrollUntilVisible:
          element:
            id: combat-avatar-ready
          direction: DOWN
          timeout: 30000
      - assertNotVisible:
          id: hero-picker
      - takeScreenshot: unity-settings-avatar
      - tapOn:
          id: tab-inventaire
      - extendedWaitUntil:
          visible:
            id: combat-avatar-ready
          timeout: 30000
      - takeScreenshot: unity-inventory-avatar
- openLink: grrindapp-dev://combat-demo?scenario=duel&at=3200
- runFlow:
    when:
      visible: "Ouvrir dans.*"
    commands:
      - tapOn: Ouvrir
- extendedWaitUntil:
    visible:
      id: battle-combat
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: unity-renderer-ready
- assertNotVisible:
    id: battle-renderer-unavailable
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - extendedWaitUntil:
          visible: Close
          timeout: 5000
      - tapOn: Close
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- takeScreenshot: unity-default-pvp
- tapOn:
    id: battle-combat
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 10000
- takeScreenshot: unity-default-pvp-recap
- tapOn:
    id: battle-exit
- extendedWaitUntil:
    visible:
      id: al-kasal-idle
    timeout: 15000
- takeScreenshot: unity-return-portrait
- setOrientation: PORTRAIT
- openLink: grrindapp-dev://combat-demo?scenario=victoire&at=3200
- extendedWaitUntil:
    visible:
      id: "battle-(dialogue|combat)"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: battle-dialogue
    commands:
      - tapOn:
          id: battle-dialogue
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: unity-renderer-ready
- takeScreenshot: unity-hero-versus-mob
- tapOn:
    id: battle-combat
- extendedWaitUntil:
    visible:
      id: battle-exit
    timeout: 10000
- tapOn:
    id: battle-exit
- extendedWaitUntil:
    visible:
      id: al-kasal-idle
    timeout: 15000
- setOrientation: PORTRAIT
- openLink: grrindapp-dev://avatar-3d
- extendedWaitUntil:
    visible:
      id: quaternius-ready
    timeout: 30000
- takeScreenshot: unity-workshop-after-combats
- setOrientation: PORTRAIT
