      id: art-item-ACADEMIC_FLIPPERS
    direction: DOWN
- tapOn:
    id: art-item-ACADEMIC_FLIPPERS
- scrollUntilVisible:
    element:
      id: art-avatar-STRENGTH_V1
    direction: UP
- tapOn:
    id: art-avatar-STRENGTH_V1
- takeScreenshot: retro-STRENGTH_V1-equipped
- scrollUntilVisible:
