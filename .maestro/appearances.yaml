appId: app.grrind.dev
---
# Standalone presentation flow: E2E_OFFLINE=1. An existing QA session also checks previews.
- launchApp
- setOrientation: PORTRAIT
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - extendedWaitUntil:
          visible: Close
          timeout: 5000
      - tapOn: Close
- runFlow:
    when:
      visible: Close
    commands:
      - tapOn: Close
- openLink: grrindapp-dev://reglages
- extendedWaitUntil:
    visible: "Santé|Se connecter"
    timeout: 30000
- assertNotVisible: "Ton personnage|Atelier avatar 3D"
- setOrientation: PORTRAIT
- runFlow:
    when:
      visible: Santé
    commands:
      - assertNotVisible:
          id: hero-picker
      - tapOn:
          id: hud-inventory
      - scrollUntilVisible:
          element:
            id: character-tab-equipment
          direction: DOWN
      - tapOn:
          id: character-tab-equipment
      - extendedWaitUntil:
          visible:
            id: combat-avatar-ready
          timeout: 30000
      - takeScreenshot: unity-inventory-avatar
- runFlow: combat-3d.yaml
