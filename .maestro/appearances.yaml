appId: app.grrind.dev
tags:
  - ios
  - combat
---
# Catalogue serveur, PATCH /me, combat et relecture avec retour au portrait.
- launchApp
- setOrientation: PORTRAIT
- runFlow:
    when:
      visible: "Ouvrir dans.*"
    commands:
      - tapOn: "Ouvrir"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Close"
          timeout: 5000
      - tapOn: "Close"
- runFlow:
    file: login.yaml
    env:
      EMAIL: ${EMPTY_EMAIL}
- extendedWaitUntil:
    visible: "NIVEAU"
    timeout: 30000
- tapOn:
    id: "tab-reglages"
- scrollUntilVisible:
    element:
      id: hero-STRENGTH_V1
    direction: DOWN
- tapOn:
    id: hero-STRENGTH_V1
- scrollUntilVisible:
    element: Apparence enregistrée
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: hero-RUNNER_V1
    direction: UP
- tapOn:
    id: hero-RUNNER_V1
- scrollUntilVisible:
    element: Apparence enregistrée
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: hero-CLIMBER_V1
    direction: UP
- tapOn:
    id: hero-CLIMBER_V1
- scrollUntilVisible:
    element: Apparence enregistrée
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: hero-SWIMMER_V1
    direction: UP
- tapOn:
    id: hero-SWIMMER_V1
- scrollUntilVisible:
    element: Apparence enregistrée
    direction: DOWN
    timeout: 15000
- takeScreenshot: retro-01-avatar-picker
- openLink: grrindapp-dev://avatars
- extendedWaitUntil:
    visible: Avatars sportifs
    timeout: 15000
- scrollUntilVisible:
    element:
      id: art-item-HALTER_EGO
    direction: DOWN
- tapOn:
    id: art-item-HALTER_EGO
- scrollUntilVisible:
    element:
      id: art-item-PURSUIT_GOGGLES
    direction: DOWN
- tapOn:
    id: art-item-PURSUIT_GOGGLES
- scrollUntilVisible:
