name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      # Symétrique du garde-fou du back, qui rejoue `make openapi` et échoue sur un diff.
      # Sans ce pendant côté client, une dérive du contrat ne se découvre qu'à l'exécution,
      # sur l'appareil, au pire moment.
      - name: Contrat API à jour
        run: npm run api:check

      - name: Lint
        run: npm run lint

      # « Un seul rafraîchissement part » ne se voit pas à l'œil : les deux issues affichent
      # le même écran, et la mauvaise ne se manifeste qu'à l'ouverture suivante, par une
      # déconnexion. C'est ici que la règle tient, pas sur un appareil.
      - name: Tests
        run: npm test
